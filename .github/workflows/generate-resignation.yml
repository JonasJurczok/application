name: Generate resignation PDFs
on:
  workflow_dispatch:
  push:
    branches:
      - trunk
    paths:
      - 'resignation.tex'
      - 'info.tex'
      - 'pictures/*'
      - '.github/*'

jobs:
  generate-cv-pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v2
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          pre_compile: "wget https://ftp.fau.de/ctan/systems/texlive/tlnet/update-tlmgr-latest.sh && chmod +x update-tlmgr-latest.sh && update-tlmgr-latest.sh -- --upgrade && tlmgr update --self && tlmgr install moderncv && tlmgr update --all"
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -diagnostics
          root_file: "resignation*.tex"
          glob_root_file: true
      - name: set date
        run: echo "NOW=$(date +'%Y.%m.%d-%H.%M.%S')" >> $GITHUB_ENV
      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resignation pdf
          path: |
            resignation.pdf
