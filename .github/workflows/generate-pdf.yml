name: Generate CV PDFs
on:
  workflow_dispatch:
  push:
    branches:
      - trunk
    paths:
      - '**.tex'
      - 'pictures/*'
      - '.github/*'

jobs:
  generate-cv-pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v2
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          pre_compile: "update-tlmgr-latest --update && tlmgr update --self && tlmgr install moderncv && tlmgr update --all"
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -diagnostics
          root_file: "curriculum-vitae*.tex"
          glob_root_file: true
      - name: set date
        run: echo "NOW=$(date +'%Y.%m.%d-%H.%M.%S')" >> $GITHUB_ENV
      - uses: ncipollo/release-action@v1
        with:
          artifacts: "*.pdf"
          tag: ${{ env.NOW }}
          token: ${{ secrets.GITHUB_TOKEN }}
