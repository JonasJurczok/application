name: Generate CV PDFs
on:
  workflow_dispatch:
  push:
    branches:
      - trunk
    paths:
      - '**.tex'

jobs:
  generate-cv-pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v2
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v2
        with:
          pre_compile: "tlmgr update --self && tlmgr install moderncv && tlmgr update --all"
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -diagnostics
          root_file: "curriculum-vitae*.tex"
          glob_root_file: true
      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.36.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: false
          RELEASE_BRANCHES: trunk
          INITIAL_VERSION: 1.0.0
      - name: Create release and add PDFs
        uses: softprops/action-gh-release@v1
        with:
          files: "*.pdf"
